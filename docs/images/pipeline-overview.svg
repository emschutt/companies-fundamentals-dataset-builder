<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline overview</title>
  <desc id="desc">Overview diagram for the company fundamentals dataset pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#edf4ea"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #334155; }
      .head { font: 700 22px Arial, sans-serif; fill: #ffffff; }
      .body { font: 500 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 16px Arial, sans-serif; fill: #475569; }
      .tag { font: 700 15px Arial, sans-serif; fill: #0f172a; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#94a3b8" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)"/>
  <text x="70" y="70" class="title">Companies Fundamentals Dataset Builder</text>
  <text x="70" y="105" class="subtitle">Open-data pipeline for aligned fundamentals, estimates, prices, and safer point-in-time features</text>

  <rect x="70" y="150" width="240" height="150" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="70" y="150" width="240" height="48" rx="24" fill="url(#panel)"/>
  <text x="95" y="182" class="head">1. Sources</text>
  <text x="95" y="225" class="body">DoltHub earnings</text>
  <text x="95" y="255" class="body">DoltHub stocks</text>
  <text x="95" y="285" class="body">S&amp;P 500 membership history</text>

  <rect x="350" y="150" width="240" height="150" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="350" y="150" width="240" height="48" rx="24" fill="url(#panel)"/>
  <text x="375" y="182" class="head">2. Base build</text>
  <text x="375" y="225" class="body">Download tables</text>
  <text x="375" y="255" class="body">Filter by historical membership</text>
  <text x="375" y="285" class="body">Write aligned parquet files</text>

  <rect x="630" y="150" width="240" height="150" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="630" y="150" width="240" height="48" rx="24" fill="url(#panel)"/>
  <text x="655" y="182" class="head">3. Enrichment</text>
  <text x="655" y="225" class="body">Yahoo Finance OHLCV</text>
  <text x="655" y="255" class="body">Returns, volume, volatility</text>
  <text x="655" y="285" class="body">Optional Defeat Beta ratios</text>

  <rect x="910" y="150" width="220" height="150" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="910" y="150" width="220" height="48" rx="24" fill="url(#panel)"/>
  <text x="935" y="182" class="head">4. PIT builder</text>
  <text x="935" y="225" class="body">Apply 45d / 90d lags</text>
  <text x="935" y="255" class="body">Drop risky columns</text>
  <text x="935" y="285" class="body">Build safer modeling panel</text>

  <line x1="310" y1="225" x2="350" y2="225" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="590" y1="225" x2="630" y2="225" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="870" y1="225" x2="910" y2="225" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="170" y="400" width="860" height="190" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text x="205" y="445" class="title" style="font-size:30px;">Main outputs</text>

  <rect x="205" y="470" width="250" height="80" rx="18" fill="#e0f2fe"/>
  <text x="225" y="500" class="tag">Broad aligned panel</text>
  <text x="225" y="528" class="small">fundamentals_estimates_prices_panel.parquet</text>

  <rect x="475" y="470" width="250" height="80" rx="18" fill="#dcfce7"/>
  <text x="495" y="500" class="tag">Safer PIT panel</text>
  <text x="495" y="528" class="small">fundamentals_estimates_prices_panel_pit.parquet</text>

  <rect x="745" y="470" width="250" height="80" rx="18" fill="#fef3c7"/>
  <text x="765" y="500" class="tag">Audit manifests</text>
  <text x="765" y="528" class="small">coverage, enrichment, and leakage metadata</text>

  <text x="70" y="640" class="subtitle">Open-data first, explicit assumptions, and better timing discipline than a naive period-date join.</text>
</svg>
