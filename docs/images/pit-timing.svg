<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Point in time timing logic</title>
  <desc id="desc">Diagram showing conservative quarterly and annual lag assumptions for statement availability.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="100%" stop-color="#f5f9ff"/>
    </linearGradient>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #111827; }
      .sub { font: 400 20px Arial, sans-serif; fill: #475569; }
      .label { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .body { font: 500 18px Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 16px Arial, sans-serif; fill: #475569; }
    </style>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#bg2)"/>
  <text x="70" y="70" class="title">Conservative point-in-time assumptions</text>
  <text x="70" y="105" class="sub">Use filing timestamps when you have them. When you do not, delay feature availability explicitly.</text>

  <rect x="70" y="160" width="1060" height="120" rx="24" fill="#ffffff" filter="url(#shadow2)"/>
  <text x="95" y="200" class="label">Quarterly statements</text>
  <line x1="95" y1="235" x2="1060" y2="235" stroke="#cbd5e1" stroke-width="6"/>
  <circle cx="180" cy="235" r="14" fill="#0ea5e9"/>
  <circle cx="495" cy="235" r="14" fill="#16a34a"/>
  <text x="140" y="270" class="body">Fiscal period end</text>
  <text x="430" y="270" class="body">Assume usable after 45 days</text>
  <rect x="195" y="214" width="285" height="42" rx="21" fill="#bae6fd"/>
  <text x="278" y="241" class="small">conservative waiting window</text>

  <rect x="70" y="315" width="1060" height="120" rx="24" fill="#ffffff" filter="url(#shadow2)"/>
  <text x="95" y="355" class="label">Annual statements</text>
  <line x1="95" y1="390" x2="1060" y2="390" stroke="#cbd5e1" stroke-width="6"/>
  <circle cx="180" cy="390" r="14" fill="#0ea5e9"/>
  <circle cx="680" cy="390" r="14" fill="#f59e0b"/>
  <text x="140" y="425" class="body">Fiscal period end</text>
  <text x="610" y="425" class="body">Assume usable after 90 days</text>
  <rect x="195" y="369" width="470" height="42" rx="21" fill="#fde68a"/>
  <text x="350" y="396" class="small">longer waiting window for annual data</text>

  <text x="70" y="485" class="sub">Estimate rows are kept only while the target period end is still ahead of the observation date.</text>
</svg>
